apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: hearth-e2e
resources:
  - namespace.yaml
  - ../../k8s/agent
images:
  - name: hearth-gateway
    newName: hearth-gateway-fake
    newTag: e2e
configMapGenerator:
  - name: hearth-agent
    literals:
      - name=e2e
    files:
      - agent.toml
      - config.toml
patches:
  - target: {kind: StatefulSet, name: hearth}
    patch: |-
      - op: add
        path: /spec/template/spec/containers/0/env/-
        value: {name: FAKE_CLAUDE_DIR, value: /home/agent/fake}
      - op: add
        path: /spec/template/spec/containers/0/imagePullPolicy
        value: Never
