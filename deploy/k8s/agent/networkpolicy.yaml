# Nothing outside the agent's namespace reaches into it. The gateway listens only on its socket, so
# this guards whatever else the namespace runs beside it (such as a memory server). Egress is open:
# turns reach the model and whatever the agent's plugins talk to.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: own-namespace-only
spec:
  podSelector: {}
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector: {}
