[build-system]
requires = ["setuptools>=84.2.1,<85"]
build-backend = "setuptools.build_meta"

[project]
name = "hearth"
version = "0.0.0"
description = "A gateway that turns wakes into Claude Code turns, and the Claude Code plugin that goes with it."
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=9.1.1,<10", "pytest-asyncio>=1.4.1,<2"]

[project.scripts]
hearth = "hearth.cli:main"

[tool.setuptools.packages.find]
include = ["hearth*"]

[tool.setuptools.package-data]
hearth = [
    "plugin/.claude-plugin/plugin.json",
    "plugin/hooks/hooks.json",
    "plugin/commands/*.md",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
