[build-system]
requires = ["setuptools>=75,<81"]
build-backend = "setuptools.build_meta"

[project]
name = "hearth"
version = "0.0.0"
description = "A harness for long-running agents, each in its own home."
requires-python = ">=3.11"
# Imported, never copied (docs/decisions/0009). Each is pinned to one commit; moving a pin is a
# reviewed change, and hearth/pins.py reads these same lines, so there is one place to change.
dependencies = [
    "frontdesk[claude-code] @ git+https://github.com/willregelmann/frontdesk.git@cd35c3e3de1fce437167607b94d49c89913f7789",
    "tapestry @ git+https://github.com/willregelmann/tapestry.git@0cf449a820f8cf3cafbd91f2916483a8c0a58050",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "pytest-asyncio>=1,<2"]

[tool.setuptools.packages.find]
include = ["hearth*"]
