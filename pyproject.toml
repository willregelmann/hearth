[build-system]
requires = ["setuptools>=75,<81"]
build-backend = "setuptools.build_meta"

[project]
name = "hearth"
version = "0.0.0"
description = "A harness for long-running agents, each in its own home."
requires-python = ">=3.11"
# Imported, never copied (docs/decisions/0009). Each is pinned to one commit; moving a pin is a
# reviewed change, and hearth/pins.py reads these same lines, so there is one place to change.
dependencies = [
    "frontdesk[claude-code] @ git+https://github.com/willregelmann/frontdesk.git@41a9cabd3043632767d86cc61d845b14b8f881c2",
    "tapestry @ git+https://github.com/willregelmann/tapestry.git@7111d7b899f54656d99118f89d94f7b0cfb0621f",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "pytest-asyncio>=1,<2"]

[tool.setuptools.packages.find]
include = ["hearth*"]
